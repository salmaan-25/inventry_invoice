name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]
  workflow_dispatch:

jobs:
  backend-audit-and-test:
    name: Backend Audit, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: billing_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: billing_inventory
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-test-secret-key-at-least-50-characters-long-for-django-security-check
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SETTINGS_MODULE: config.settings.development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install System Dependencies (Pango / WeasyPrint PDF Engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpango1.0-dev libffi-dev shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Django System Check (Development)
        run: |
          python manage.py check --settings=config.settings.development

      - name: 2. Django Security Deployment Check (Production)
        run: |
          python manage.py check --settings=config.settings.production --deploy

      - name: 3. Verify Database Migrations Sync (Drift Detection)
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: 4. Run Pytest Test Suite
        run: |
          pytest -v --strict-markers
